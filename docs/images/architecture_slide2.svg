<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="100%" height="100%" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="840" height="50" rx="10" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="56" fill="#F8FAFC" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">THERMOTRACE AI — END-TO-END SYSTEM ARCHITECTURE</text>

  <!-- Layer 1: Data Sources -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="840" height="95" rx="10" fill="url(#blueCard)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="28" rx="10" fill="#2563EB" opacity="0.3"/>
    <text x="20" y="20" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="0.5">LAYER 1: SATELLITE &amp; GEOSPATIAL DATA SOURCES</text>
    
    <rect x="20" y="38" width="250" height="45" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-width="1"/>
    <text x="145" y="56" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">NASA FIRMS Telemetry</text>
    <text x="145" y="73" fill="#94A3B8" font-size="10" text-anchor="middle">VIIRS (375m) &amp; MODIS (1km)</text>

    <rect x="295" y="38" width="250" height="45" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-width="1"/>
    <text x="420" y="56" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">ESA WorldCover 10m</text>
    <text x="420" y="73" fill="#94A3B8" font-size="10" text-anchor="middle">Land Cover &amp; Urban Zoning</text>

    <rect x="570" y="38" width="250" height="45" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-width="1"/>
    <text x="695" y="56" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">Sentinel-2 Optical</text>
    <text x="695" y="73" fill="#94A3B8" font-size="10" text-anchor="middle">MSI Level-2A BOA Reference</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="450" y1="190" x2="450" y2="215" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Ingestion & Sovereign Geofencing -->
  <g transform="translate(30, 220)" filter="url(#shadow)">
    <rect width="840" height="85" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="26" rx="10" fill="#0284C7" opacity="0.2"/>
    <text x="20" y="18" fill="#7DD3FC" font-size="12" font-weight="700">LAYER 2: INGESTION DAEMON &amp; SOVEREIGN BOUNDARY FILTER</text>

    <rect x="20" y="35" width="385" height="40" rx="6" fill="#0F172A" stroke="#0369A1" stroke-width="1"/>
    <text x="212" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Autonomous 5-Min Poller Daemon</text>
    <text x="212" y="67" fill="#94A3B8" font-size="10" text-anchor="middle">Multi-Sensor Asynchronous Stream Ingestion</text>

    <rect x="435" y="35" width="385" height="40" rx="6" fill="#0F172A" stroke="#0369A1" stroke-width="1"/>
    <text x="627" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Survey of India Sovereign Geofence</text>
    <text x="627" y="67" fill="#94A3B8" font-size="10" text-anchor="middle">Discards Transboundary Non-Sovereign Points</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="305" x2="450" y2="330" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: ST-DBSCAN Clustering -->
  <g transform="translate(30, 335)" filter="url(#shadow)">
    <rect width="840" height="85" rx="10" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="26" rx="10" fill="#D97706" opacity="0.25"/>
    <text x="20" y="18" fill="#FDE68A" font-size="12" font-weight="700">LAYER 3: SPATIO-TEMPORAL CLUSTERING ENGINE (ST-DBSCAN)</text>

    <rect x="20" y="35" width="250" height="40" rx="6" fill="#0F172A" stroke="#B45309" stroke-width="1"/>
    <text x="145" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Spatial Radius ε = 1500m</text>
    <text x="145" y="67" fill="#94A3B8" font-size="10" text-anchor="middle">Haversine Distance Clustering</text>

    <rect x="295" y="35" width="250" height="40" rx="6" fill="#0F172A" stroke="#B45309" stroke-width="1"/>
    <text x="420" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Temporal Window Δt = 24h</text>
    <text x="420" y="67" fill="#94A3B8" font-size="10" text-anchor="middle">Multi-Pass Event Aggregation</text>

    <rect x="570" y="35" width="250" height="40" rx="6" fill="#0F172A" stroke="#B45309" stroke-width="1"/>
    <text x="695" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Physical Event Boundary</text>
    <text x="695" y="67" fill="#94A3B8" font-size="10" text-anchor="middle">Peak FRP (MW), Centroid, Temp</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="450" y1="420" x2="450" y2="445" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Feature Extraction & Context Fusion -->
  <g transform="translate(30, 450)" filter="url(#shadow)">
    <rect width="840" height="85" rx="10" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="26" rx="10" fill="#7E22CE" opacity="0.25"/>
    <text x="20" y="18" fill="#E9D5FF" font-size="12" font-weight="700">LAYER 4: CANONICAL 14-D FEATURE VECTOR &amp; CONTEXT FUSION</text>
    
    <text x="450" y="52" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Normalized 14-Dimensional Analytical Feature Matrix</text>
    <text x="450" y="70" fill="#CBD5E1" font-size="10" text-anchor="middle">dist_to_fac • peak_frp • mean_frp • var_frp • temp_k • duration • day_night_ratio • pct_crop • pct_forest • pct_urban • zoning</text>
  </g>

  <!-- Split Arrows 4 -> 5A & 5B -->
  <path d="M 450 535 L 450 555 L 240 555 L 240 575" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450 535 L 450 555 L 660 555 L 660 575" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5A & 5B: ML Classifier & Baseline Engine -->
  <g transform="translate(30, 580)" filter="url(#shadow)">
    <!-- 5A: ML Classifier -->
    <rect x="0" y="0" width="405" height="110" rx="10" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="0" y="0" width="405" height="26" rx="10" fill="#BE185D" opacity="0.25"/>
    <text x="15" y="18" fill="#FBCFE8" font-size="11" font-weight="700">LAYER 5A: CALIBRATED XGBOOST v1.1</text>
    <text x="202" y="48" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Platt-Scaled / Isotonic Calibration</text>
    <text x="202" y="65" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">Expected Calibration Error: ECE &lt; 3.2%</text>
    <text x="202" y="82" fill="#94A3B8" font-size="9.5" text-anchor="middle">6 Classes: IND_FIRE, IND_FLARE, IND_ROUTINE,</text>
    <text x="202" y="96" fill="#94A3B8" font-size="9.5" text-anchor="middle">AGRI_BURN, WILDFIRE, OTHER_UNCERTAIN</text>

    <!-- 5B: Baseline Engine -->
    <rect x="435" y="0" width="405" height="110" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="435" y="0" width="405" height="26" rx="10" fill="#047857" opacity="0.25"/>
    <text x="450" y="18" fill="#A7F3D0" font-size="11" font-weight="700">LAYER 5B: 90-DAY FACILITY BASELINES</text>
    <text x="637" y="48" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Gaussian Empirical Baselines (N &gt;= 10)</text>
    <text x="637" y="65" fill="#FBBF24" font-size="10" font-weight="700" text-anchor="middle">Statistical Z-Score: Z = (FRP - μ) / σ</text>
    <text x="637" y="82" fill="#94A3B8" font-size="9.5" text-anchor="middle">CRITICAL (Z &gt;= 4.0σ) | ABNORMAL (Z &gt;= 2.5σ)</text>
    <text x="637" y="96" fill="#94A3B8" font-size="9.5" text-anchor="middle">ELEVATED (Z &gt;= 1.5σ) | NOMINAL (Z &lt; 1.5σ)</text>
  </g>

  <!-- Merge Arrows 5A,5B -> 6 -->
  <path d="M 240 690 L 240 710 L 450 710 L 450 725" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 660 690 L 660 710 L 450 710 L 450 725" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Layer 6: Tier 2 On-Demand Compute & Explainability -->
  <g transform="translate(30, 730)" filter="url(#shadow)">
    <rect width="840" height="75" rx="10" fill="url(#purpleCard)" stroke="#C084FC" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" rx="10" fill="#9333EA" opacity="0.3"/>
    <text x="20" y="17" fill="#F3E8FF" font-size="11" font-weight="700">LAYER 6: TIER 2 ON-DEMAND COMPUTE &amp; EXPLAINABLE AI (XAI)</text>

    <text x="450" y="44" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">On-Demand TreeSHAP Attribution + Zero-Hallucination Epistemic Tagging</text>
    <text x="450" y="61" fill="#DDD6FE" font-size="10" text-anchor="middle">Computes Exact Shapley Drivers • Sentinel-2 Time-Delta Match • OBSERVED / DERIVED / MODELLED Contracts</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="450" y1="805" x2="450" y2="825" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 7: Operational Application Layer -->
  <g transform="translate(30, 830)" filter="url(#shadow)">
    <rect width="840" height="110" rx="10" fill="url(#emeraldCard)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="26" rx="10" fill="#059669" opacity="0.3"/>
    <text x="20" y="18" fill="#D1FAE5" font-size="12" font-weight="700">LAYER 7: DEFENSE-GRADE OPERATIONAL APPLICATION LAYER</text>

    <rect x="20" y="38" width="190" height="58" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="115" y="58" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">MapLibre GL Radar</text>
    <text x="115" y="73" fill="#94A3B8" font-size="9" text-anchor="middle">Dynamic Camera Offset</text>
    <text x="115" y="86" fill="#34D399" font-size="9" font-weight="600" text-anchor="middle">9-Icon Symbology</text>

    <rect x="225" y="38" width="190" height="58" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="320" y="58" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Thermo News &amp; SSE</text>
    <text x="320" y="73" fill="#94A3B8" font-size="9" text-anchor="middle">Time-Ordered Stream</text>
    <text x="320" y="86" fill="#F59E0B" font-size="9" font-weight="600" text-anchor="middle">Critical Alert Queue</text>

    <rect x="430" y="38" width="190" height="58" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="525" y="58" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Grounded RAG Chat</text>
    <text x="525" y="73" fill="#94A3B8" font-size="9" text-anchor="middle">Local LLM Architecture</text>
    <text x="525" y="86" fill="#60A5FA" font-size="9" font-weight="600" text-anchor="middle">Telemetry Injected</text>

    <rect x="635" y="38" width="185" height="58" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="727" y="58" fill="#F1F5F9" font-size="11" font-weight="600" text-anchor="middle">Forensic PDF Dossier</text>
    <text x="727" y="73" fill="#94A3B8" font-size="9" text-anchor="middle">ReportLab Vector Brief</text>
    <text x="727" y="86" fill="#F43F5E" font-size="9" font-weight="600" text-anchor="middle">SHA-256 Checksum</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="450" y1="940" x2="450" y2="960" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 8: PostGIS Spatial Storage -->
  <g transform="translate(30, 965)" filter="url(#shadow)">
    <rect width="840" height="60" rx="10" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="450" y="28" fill="#F1F5F9" font-size="12" font-weight="700" text-anchor="middle">LAYER 8: POSTGRESQL 16 + POSTGIS 3.4 ENTERPRISE SPATIAL DATABASE</text>
    <text x="450" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">GIST Spatial Indexes • 27 Registered Industrial Facilities • 1,299 Historical Clustered Events • Forensic Archive</text>
  </g>

  <!-- Bottom Uniqueness Pillar Highlights -->
  <g transform="translate(30, 1045)" filter="url(#shadow)">
    <rect width="840" height="75" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    
    <rect x="15" y="10" width="260" height="55" rx="6" fill="#1E293B" stroke="#EC4899" stroke-width="1"/>
    <text x="145" y="28" fill="#FBCFE8" font-size="10.5" font-weight="700" text-anchor="middle">1. CALIBRATED ML (ECE &lt; 3.2%)</text>
    <text x="145" y="44" fill="#CBD5E1" font-size="9" text-anchor="middle">Platt-scaled true probabilities</text>
    <text x="145" y="56" fill="#CBD5E1" font-size="9" text-anchor="middle">+ exact TreeSHAP decision XAI</text>

    <rect x="290" y="10" width="260" height="55" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="420" y="28" fill="#A7F3D0" font-size="10.5" font-weight="700" text-anchor="middle">2. 90-DAY FACILITY BASELINES</text>
    <text x="420" y="44" fill="#CBD5E1" font-size="9" text-anchor="middle">Gaussian Z-scores (N &gt;= 10)</text>
    <text x="420" y="56" fill="#CBD5E1" font-size="9" text-anchor="middle">eliminates operational false alarms</text>

    <rect x="565" y="10" width="260" height="55" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="695" y="28" fill="#BAE6FD" font-size="10.5" font-weight="700" text-anchor="middle">3. FORENSIC DIGITAL PROVENANCE</text>
    <text x="695" y="44" fill="#CBD5E1" font-size="9" text-anchor="middle">SHA-256 signed vector PDF briefs</text>
    <text x="695" y="56" fill="#CBD5E1" font-size="9" text-anchor="middle">for environmental court enforcement</text>
  </g>
</svg>
