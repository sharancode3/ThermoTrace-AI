<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="100%" height="100%" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="15" y="10" width="410" height="30" rx="6" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="220" y="30" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">THERMOTRACE AI ARCHITECTURE</text>

  <!-- 1. Data Sources -->
  <g transform="translate(15, 48)" filter="url(#shadow)">
    <rect width="410" height="58" rx="6" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="12" y="18" fill="#60A5FA" font-size="10" font-weight="700">1. MULTI-SENSOR DATA SOURCES</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• NASA FIRMS (VIIRS 375m &amp; MODIS 1km NRT Telemetry)</text>
    <text x="12" y="48" fill="#94A3B8" font-size="9">• ESA WorldCover 10m Land Use + 27 Industrial Baselines</text>
  </g>
  <line x1="220" y1="106" x2="220" y2="118" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Ingestion & Geofencing -->
  <g transform="translate(15, 120)" filter="url(#shadow)">
    <rect width="410" height="58" rx="6" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#38BDF8" font-size="10" font-weight="700">2. INGESTION &amp; SOVEREIGN GEOFENCING</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• 5-Minute Continuous Poller Daemon</text>
    <text x="12" y="48" fill="#94A3B8" font-size="9">• Survey of India Sovereign Boundary Filter (Discards Foreign)</text>
  </g>
  <line x1="220" y1="178" x2="220" y2="190" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Event Clustering & 14-D Vector -->
  <g transform="translate(15, 192)" filter="url(#shadow)">
    <rect width="410" height="58" rx="6" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="18" fill="#FBBF24" font-size="10" font-weight="700">3. EVENT CLUSTERING &amp; 14-D FEATURE FUSION</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• ST-DBSCAN Clustering (Radius ε=1500m, Window Δt=24h)</text>
    <text x="12" y="48" fill="#94A3B8" font-size="9">• 14-D Matrix: Peak/Mean FRP, Temp, Land Cover %, Zoning</text>
  </g>
  <line x1="220" y1="250" x2="220" y2="262" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. ML & Baseline Engine -->
  <g transform="translate(15, 264)" filter="url(#shadow)">
    <rect width="410" height="66" rx="6" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.2"/>
    <text x="12" y="18" fill="#F472B6" font-size="10" font-weight="700">4. CALIBRATED ML &amp; 90-DAY BASELINE ENGINE</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• Platt-Calibrated XGBoost (ECE &lt; 3.2% | 6 Combustion Classes)</text>
    <text x="12" y="48" fill="#34D399" font-size="9.5" font-weight="600">• Rolling 90-Day Gaussian Baselines: Z = (Peak FRP - μ) / σ</text>
    <text x="12" y="60" fill="#94A3B8" font-size="8.5">• 4 Anomaly Tiers: Critical (&gt;=4.0σ), Abnormal, Elevated, Nominal</text>
  </g>
  <line x1="220" y1="330" x2="220" y2="342" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Tier 2 XAI & RAG Grounding -->
  <g transform="translate(15, 344)" filter="url(#shadow)">
    <rect width="410" height="58" rx="6" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#C084FC" font-size="10" font-weight="700">5. TIER 2 ON-DEMAND XAI &amp; RAG GROUNDING</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• Exact TreeSHAP Feature Decision Drivers</text>
    <text x="12" y="48" fill="#94A3B8" font-size="9">• Zero-Hallucination Contracts (OBSERVED / DERIVED / MODELLED)</text>
  </g>
  <line x1="220" y1="402" x2="220" y2="414" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Application Layer & Storage -->
  <g transform="translate(15, 416)" filter="url(#shadow)">
    <rect width="410" height="72" rx="6" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="18" fill="#34D399" font-size="10" font-weight="700">6. OPERATIONAL APPLICATION LAYER &amp; POSTGIS</text>
    <text x="12" y="34" fill="#F1F5F9" font-size="9.5" font-weight="600">• Tactical Radar (Dynamic Offset [-180, 0] + 9-Icon Symbology)</text>
    <text x="12" y="48" fill="#F1F5F9" font-size="9.5" font-weight="600">• Real-Time Thermo News Feed + Server-Sent Alert Queue</text>
    <text x="12" y="62" fill="#38BDF8" font-size="9">• Grounded AI Chat • SHA-256 Signed Vector PDF Dossiers</text>
  </g>

  <!-- Bottom Mini Footer -->
  <rect x="15" y="498" width="410" height="50" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
  <text x="220" y="518" fill="#F8FAFC" font-size="9.5" font-weight="700" text-anchor="middle">KEY INNOVATIONS: ECE &lt; 3.2% ML | 90-DAY BASELINES | SHA-256 PROVENANCE</text>
  <text x="220" y="534" fill="#94A3B8" font-size="8.5" text-anchor="middle">PostgreSQL 16 + PostGIS 3.4 Spatial Storage • Sub-50ms Response Time</text>
</svg>
