services:
  # ---------------------------------------------------------
  # PostgreSQL + PostGIS (System of Record)
  # ---------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: thermotrace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thermo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thermo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermo_admin} -d ${POSTGRES_DB:-thermo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # Redis (Cache & Task Broker)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: thermotrace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # FastAPI Backend (REST API)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermotrace_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-thermo_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thermo_secret}
      - POSTGRES_DB=${POSTGRES_DB:-thermo_db}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_MAP_KEY=5ee48ea9900661577c1dc26dfcc70550
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------
  # Celery Worker (Task Processing)
  # ---------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermotrace_celery_worker
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-thermo_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thermo_secret}
      - POSTGRES_DB=${POSTGRES_DB:-thermo_db}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_MAP_KEY=5ee48ea9900661577c1dc26dfcc70550
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.celery_config.celery_app worker --loglevel=info --concurrency=4

  # ---------------------------------------------------------
  # NASA FIRMS 5-Minute Ingestion Daemon
  # ---------------------------------------------------------
  firms_daemon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermotrace_firms_daemon
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-thermo_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thermo_secret}
      - POSTGRES_DB=${POSTGRES_DB:-thermo_db}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_MAP_KEY=5ee48ea9900661577c1dc26dfcc70550
      - FIRMS_POLL_INTERVAL_MINUTES=5
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python scripts/firms_daemon.py

  # ---------------------------------------------------------
  # Next.js Frontend (GIS UI)
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermotrace_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  postgres_data:
