services:
  - type: web
    name: thermotrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENABLE_FIRMS_POLLING
        value: "false"
      - key: FIRMS_POLL_INTERVAL_MINUTES
        value: "60"
      - key: FIRMS_MAP_KEY
        value: "5ee48ea9900661577c1dc26dfcc70550"
      - key: DATABASE_URL
        value: "sqlite:///data/sovereign_benchmark.sqlite"
